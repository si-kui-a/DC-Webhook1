name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      # PAT-28：fetch-depth:0——原本預設shallow(只抓1個commit)，讓最後一步
      # 「git diff --check」(不帶任何ref引數)永遠只比對working tree跟
      # 目前checkout那個commit的index，兩者checkout後必然相同，這個檢查
      # 對任何PR的實際改動都是恆真通過，從沒真的擋過任何一次whitespace
      # 問題。要完整歷史才能對真正的base/前一個commit做diff。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: UTF-8 check
        run: python scripts/check_encoding.py
      - name: Compile
        run: python -m compileall -q .
      - name: Offline tests
        run: |
          pip install pytest
          python -m pytest test/ tests/ -v
      - name: Patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            BASE="$PR_BASE_SHA"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE="HEAD~1"
          else
            echo "no base commit available to diff against (first commit on the branch?), skipping"
            exit 0
          fi
          git diff --check "$BASE" HEAD
