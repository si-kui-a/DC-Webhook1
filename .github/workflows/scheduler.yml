name: scheduler

# Cloud replacement for the Windows IntelPusher-* scheduled tasks (except ResumeBot,
# a long-lived Discord bot that Actions can't host). One hourly tick; which tasks
# run is decided by scripts/cloud_scheduler.py (Taipei time, with same-day catch-up).
#
# State: data.db + work/ are restored from / saved to the Actions cache each tick
# (cache storage is free; artifacts count against the 500MB free quota). A daily
# artifact copy is kept as a backup in case the cache is evicted.
#
# Trigger: the hourly tick comes from an external cron calling the workflow_dispatch
# API. GitHub's own schedule event is best-effort and since 2026-08-26 has run
# 2-6 h late on this account (keyword-radar, content-health). The native cron below
# is the safety net; the dispatcher's catch-up makes late/double ticks harmless.
# Every 3 h (2026-10-08): the Apps Script trigger (deployed 10-08) gives the hourly
# ticks; hourly here too only doubled them. Its first gap of over 3 h pushes an alert
# (cloud_scheduler.tick_gap_alert), so a dead trigger is noticed within one fallback.
# On-time reminders do not depend on tick minutes: jobs/precise_send.py books send_at.yml.
on:
  schedule:
    - cron: '43 */3 * * *'  # odd minute avoids top-of-hour congestion
  workflow_dispatch:
    inputs:
      only:
        description: 'Space-separated task names to run now (ignores the schedule). Empty = normal tick.'
        required: false
        default: ''
      dry_run:
        description: 'Print what would run; no scraping, no pushes, no state change.'
        type: boolean
        default: false
      force:
        description: 'With "only": also rerun tasks that already succeeded today (they would push again).'
        type: boolean
        default: false
      mark_done_today:
        description: 'Cutover: mark tasks already due today as done without running them.'
        type: boolean
        default: false

# One tick at a time, never cancelled: two runs restoring the same data.db
# snapshot would each save a fork and one side's dedup/portfolio writes would be lost.
concurrency:
  group: ip-state
  cancel-in-progress: false

# data/thu_academic_calendar.json is not pushed back: nothing outside this job reads
# it (grep over C:\Projects, 2026-09-24), so a bot commit to main every day buys nothing.
permissions:
  contents: read
  actions: write   # prune old state caches

env:
  TZ: Asia/Taipei
  PYTHONUTF8: '1'

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # must finish before the next hourly tick
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # 3.13+ enables VERIFY_X509_STRICT, which rejects TWCA gov certs (no SKI) on Linux; CI tests run on 3.12 too
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write .env from secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then echo "::error::secret DOTENV is not set"; exit 1; fi
          printf '%s\n' "$DOTENV" > .env

      # The repo is public, so its logs are world-readable. DOTENV is one multi-line secret and
      # GitHub doesn't guarantee redacting multi-line secrets line by line, so every value is
      # masked on its own: a webhook URL printed in some error message then shows as ***.
      - name: Mask every .env value
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|\#*|*=) continue ;; esac
            value="${line#*=}"; value="${value%\"}"; value="${value#\"}"
            echo "::add-mask::$value"
          done < .env

      # Caches are readable by workflows from fork pull requests, so the state is only ever
      # cached encrypted (key STATE_KEY lives inside DOTENV; the local .env keeps a copy for
      # restoring to the laptop, see docs/operations/CLOUD_SCHEDULER.md).
      - name: Restore state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: ip-state-${{ github.run_id }}
          restore-keys: ip-state-

      - name: Decrypt state
        if: steps.restore.outputs.cache-matched-key != ''
        run: |
          key=$(sed -n 's/^STATE_KEY=//p' .env)
          if [ -z "$key" ]; then echo "::error::STATE_KEY missing from DOTENV"; exit 1; fi
          STATE_KEY="$key" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in state.enc | tar -xzf -
          test -s data.db

      # First run only: take the encrypted seed uploaded from the local machine (release
      # "state-seed"). Refuse to start from an empty DB -- dedup history would be gone
      # and every source would re-push everything it has ever seen.
      - name: Seed state if cache is empty
        if: steps.restore.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A published (not draft) release: github.token only has contents:read, which can't
          # list draft releases (the 2026-09-26 cutover failed on exactly that). Published
          # releases of a public repo are public, so the seed is encrypted like the cache.
          gh release download state-seed --pattern 'state-seed.enc' --dir /tmp \
            || { echo "::error::no cached state and no state-seed release; refusing to start from an empty data.db"; exit 1; }
          key=$(sed -n 's/^STATE_KEY=//p' .env)
          if [ -z "$key" ]; then echo "::error::STATE_KEY missing from DOTENV"; exit 1; fi
          STATE_KEY="$key" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in /tmp/state-seed.enc | tar -xzf -
          test -s data.db

      - name: Dispatch
        id: dispatch
        continue-on-error: true  # state must still be saved when a task fails
        env:  # inputs via env, never interpolated into the script text
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          MARK_DONE: ${{ inputs.mark_done_today }}
          FORCE: ${{ inputs.force }}
          # registered campus activities (jobs/thu_events.py); a personal schedule, so it is a
          # secret set by scripts/add_thu_event.py, never a file in this public repo
          THU_EVENTS: ${{ secrets.THU_EVENTS }}
          # jobs/precise_send.py dispatches send_at.yml (actions: write) and checks its runs
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then read -ra names <<< "$ONLY"; args+=(--only "${names[@]}"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$MARK_DONE" = "true" ]; then args+=(--mark-done-today); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/cloud_scheduler.py "${args[@]}"

      - name: Encrypt state
        id: encrypt
        if: always() && hashFiles('data.db') != ''
        run: |
          key=$(sed -n 's/^STATE_KEY=//p' .env)
          if [ -z "$key" ]; then echo "::error::STATE_KEY missing from DOTENV"; exit 1; fi
          tar -czf - data.db work/ | STATE_KEY="$key" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STATE_KEY -out state.enc

      - name: Save state
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: ip-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Due when the newest backup artifact is >20 h old (or missing). A fixed UTC hour
      # never matched: the fallback cron fires at 01/07/13/19 UTC, so only a tick that
      # happened to be delayed into 03 UTC backed up (1 artifact in 7 days, 2026-10-04).
      - name: Decide daily backup
        id: backup
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("state-backup-")) and (.expired | not)) | .created_at] | max // empty' 2>/dev/null || true)
          due=true
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 72000 ]; then due=false; fi
          echo "last backup: ${last:-none} -> due=$due"
          echo "due=$due" >> "$GITHUB_OUTPUT"

      # Artifacts of a public repo can be downloaded by any signed-in GitHub user: encrypted only.
      - name: Daily state backup
        if: always() && steps.backup.outputs.due == 'true' && steps.encrypt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: state-backup-${{ github.run_id }}
          path: state.enc
          retention-days: 7

      # Dead man's switch: Healthchecks.io alerts when these pings stop or report failure.
      # HC_PING_URL lives in DOTENV (masked above) so nobody can spoof pings from the logs.
      - name: Report to Healthchecks
        if: always()
        env:
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          url=$(sed -n 's/^HC_PING_URL=//p' .env)
          if [ -z "$url" ]; then exit 0; fi
          suffix=""; if [ "$OUTCOME" != "success" ]; then suffix="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url$suffix" || true

      - name: Prune old state caches (keep newest 3)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key ip-state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true

      - name: Fail if any task failed
        if: steps.dispatch.outcome == 'failure'
        run: exit 1
