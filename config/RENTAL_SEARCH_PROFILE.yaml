# 2026-09-11查證：這份檔案目前完全沒有被scrapers/rental_search.py或任何
# .py檔讀取(全repo grep零命中)。實際生效的設定只有RENTAL_FEED_URLS +
# 直接讀取的RENTAL_AREAS/RENTAL_KEYWORDS/RENTAL_EXCLUDE/RENTAL_MAX_
# MONTHLY/RENTAL_MIN_MONTHLY/RENTAL_ROOM_TYPES/RENTAL_MIN_PING/
# RENTAL_COOKING_PREFERENCE這幾個環境變數(見rental_search.py docstring)。
# 這份檔案描述的通勤時間篩選/女性學生房源目標/租補後有效租金這整套設計
# 是尚未實作的規劃文件，不是生效中的設定——修改這裡不會改變任何行為。
# 若要讓這裡真的生效，需要在rental_search.py新增讀取+套用這份yaml的
# 邏輯，屬於新功能開發，不是本次bug修復範圍。
version: 1
anchor:
  name: 東海大學
  address: 台中市西屯區臺灣大道四段1727號
  max_transit_minutes: 30
  verification: required
candidate_stops:
  - 東海大學
  - 台中榮總
  - 台中捐血中心
  - 中港轉運站
  - 朝馬轉運站
routes_reference:
  - 300-310
  - 161
  - 677
notes:
  - 來源有 transit_minutes 時，必須 <= max_transit_minutes 才能自動通過。
  - 來源沒有 transit_minutes 時，只能依 candidate_stops/地區初篩，推播標記「需路線複核」。
  - 到站時間與轉乘應以臺中市公車動態暨路網轉乘系統重新查核。
rent:
  min_monthly: 3000
  max_monthly: 4500
  preferred_max_monthly: 4000
housing:
  target: female_student
  preferred_room_types:
    - 套房
    - 獨立套房
  note: 女性/學生友善須以房源明確標示或聯絡確認，不自動推定。
subsidy:
  target_basis: rent_after_subsidy
  min_effective_monthly: 3000
  max_effective_monthly: 4500
  preferred_effective_max_monthly: 4000
  explicit_amount_required_for_confirmation: true
  note: 未提供租補金額的房源只列為補助待核，不宣稱符合。
cooking:
  preference: prefer
  allowed: 加分
  not_allowed: 納入
  unknown: 納入但標記待確認
