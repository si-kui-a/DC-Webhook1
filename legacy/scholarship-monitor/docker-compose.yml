# [WHY] 移除原方案的 n8n service：理由詳見 src/scheduler.js 開頭註解。
#       此 compose 只保留應用本身一個 container，資料以 volume 掛載，
#       確保 container 重建時 data/*.json（db.json/runs.json/sources.json）跟
#       work/*.log 不會遺失（純 JSON 檔案儲存，非 SQLite）。
services:
  scholarship-monitor:
    build: .
    container_name: scholarship-monitor
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./work:/app/work
      - ./config:/app/config
    env_file:
      - .env
    # [HOW] 預期資源消耗：CPU < 3%、RAM 50-100MB（比原方案 n8n+SQLite 組合更輕，
    #       少了 n8n 本身的 Node.js runtime + workflow engine 開銷，現在也不再需要
    #       任何原生模組編譯或常駐資料庫進程）。
    deploy:
      resources:
        limits:
          memory: 150M
